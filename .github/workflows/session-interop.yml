name: Session interop

# The Zig fx and Rust Chip share one durable session store. This builds the real Zig binary and
# the two Rust drivers (rkendel1/chip-rs: session_tool, turn_tool) and makes the two implementations
# take turns on the same session directories: Zig creates and Rust persists a real turn; Rust
# creates and Zig resumes; crashes at every commit boundary; malformed and unsupported events;
# and a negative control. No credentials and no network model provider: Zig talks to a scripted
# local gateway and Rust Chip runs a scripted model.
#
# CHIP_RS_REF names the chip-rs commit tested against. It is a full commit SHA that is merged
# into chip-rs main, never a branch or tag name, so a later branch update cannot change the Chip
# implementation this job tests. The "Check the pin" step enforces that. To move the pin, merge the
# chip-rs change first and then set this to the merge commit.

on:
  push:
    paths:
      - "src/core/session/**"
      - "docs/rebuild/tools/verify_session_interop.py"
      - "docs/rebuild/tools/verify_rust_session_resume.py"
      - "docs/rebuild/tools/scripted_gateway.py"
      - ".github/workflows/session-interop.yml"
  pull_request:
    paths:
      - "src/core/session/**"
      - "docs/rebuild/tools/verify_session_interop.py"
      - "docs/rebuild/tools/verify_rust_session_resume.py"
      - "docs/rebuild/tools/scripted_gateway.py"
      - ".github/workflows/session-interop.yml"
  workflow_dispatch:

concurrency:
  group: session-interop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Merge of rkendel1/chip-rs#22: the first main commit with chip-session and chip-turns.
  CHIP_RS_REF: 6e8c28c7817ab2724f2739fcbd310f00ffbe29da

jobs:
  interop:
    name: Zig and Rust on one session store
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: rkendel1/chip-rs
          ref: ${{ env.CHIP_RS_REF }}
          path: chip-rs
          fetch-depth: 1

      - name: Check the pin
        working-directory: chip-rs
        run: |
          case "$CHIP_RS_REF" in
            *[!0-9a-f]*|"") echo "CHIP_RS_REF must be a lowercase hex commit SHA, got: $CHIP_RS_REF" >&2; exit 1 ;;
          esac
          test "${#CHIP_RS_REF}" -eq 40 || { echo "CHIP_RS_REF must be a full 40 character SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$CHIP_RS_REF" || { echo "checked out $(git rev-parse HEAD), not the pin" >&2; exit 1; }
          test -d crates/chip-turns || { echo "the pinned commit has no crates/chip-turns" >&2; exit 1; }
          # The pin must be merged into chip-rs main (a commit only on a branch can be lost).
          git fetch --no-tags --filter=blob:none origin main
          git merge-base --is-ancestor "$CHIP_RS_REF" FETCH_HEAD || { echo "$CHIP_RS_REF is not merged into chip-rs main" >&2; exit 1; }
          echo "chip-rs pinned at $CHIP_RS_REF (merged into main)"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the Zig binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Build the Rust drivers
        working-directory: chip-rs
        run: cargo build --locked -p chip-session --example session_tool -p chip-turns --example turn_tool

      - name: Zig creates, Rust appends, Zig resumes (and the reverse)
        run: |
          python3 docs/rebuild/tools/verify_rust_session_resume.py \
            --session-tool chip-rs/target/debug/examples/session_tool

      - name: Rust Chip turns over the Zig session store
        run: |
          python3 docs/rebuild/tools/verify_session_interop.py \
            --session-tool chip-rs/target/debug/examples/session_tool \
            --turn-tool chip-rs/target/debug/examples/turn_tool
