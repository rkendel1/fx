name: Rust core

# Gates for the Rust FX inference contract (rust/fx-core). Additive: the Zig,
# native, N-API, WASM and Full CI workflows are unchanged.

on:
  push:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: rust/fx-core
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        working-directory: .
        run: |
          channel="$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build native
        run: cargo build --locked --release

      - name: Build wasm32-unknown-unknown
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Dependency and source boundaries
        run: ./check-boundaries.sh
